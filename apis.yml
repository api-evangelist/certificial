aid: certificial
name: Certificial
description: 'Certificial operates the Smart COI Network, a real-time certificate
  of insurance (COI) tracking, issuance and compliance platform used by requestors,
  insureds, and insurance agents and brokers. Instead of a static PDF certificate that
  goes stale the moment a policy changes, Certificial maintains a continuously monitored
  Smart COI that reflects policy-level changes as they happen and notifies every party
  to the relationship. The company sells two API products to software platforms — an
  Insurance Tracking API for pulling real-time, source-verified coverage data and COI
  documents into a host platform, and a COI Issuance API for InsurTech and agency-management
  vendors that need to generate and automatically reissue ACORD-form certificates. The
  platform API is live at my.certificial.com/api/ but is credential-gated, and no public
  API reference, OpenAPI definition, or developer portal is published — API access is
  arranged through a sales/reseller conversation.'
